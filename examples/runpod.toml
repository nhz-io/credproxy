# credproxy: services whose API keys it holds (sealed in ~/.secrets/<secret>.age) and what each may call.
# Copy to ~/.config/credproxy/config.toml. Seal the key first: age -R <recipients> -o ~/.secrets/runpod/api-key.age
idle_lock = "12h"
listen = "127.0.0.1:7777"

# RunPod, for a rented-GPU launcher: create, inspect and delete pods, GPU prices, billing. Nothing else.
# Clients call http://127.0.0.1:7777/runpod/v1/... and http://127.0.0.1:7777/runpod/graphql
# with "Authorization: Bearer <token>".
[services.runpod]
secret = "runpod/api-key"
token = "credproxy-local"       # not a secret: accepted only from this machine (see README, Limits)

[[services.runpod.routes]]
prefix = "/v1"
upstream = "https://rest.runpod.io/v1"
allow = ["GET /pods", "POST /pods", "GET /pods/{id}", "DELETE /pods/{id}", "GET /billing/pods"]

[[services.runpod.routes]]
prefix = "/graphql"
upstream = "https://api.runpod.io/graphql"
graphql_queries = ["gpuTypes"]
