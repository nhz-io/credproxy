[package]
name = "credproxy"
version = "0.1.0"
edition = "2024"
description = "Local proxy that holds age-sealed API keys in memory (one Touch ID per unlock) and adds them to allowlisted requests"
license = "MIT"
repository = "https://github.com/nhz-io/credproxy"

[profile.release]
strip = true

[dependencies]
bytes = "1.12.1"
getrandom = "0.4.3"
graphql-parser = "0.4.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
toml = "1.1.8"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
