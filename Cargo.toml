[package]
name = "credproxy"
version = "0.2.0"
edition = "2024"
description = "Local proxy that holds age-sealed API keys in memory (one Touch ID per unlock) and adds them to allowlisted requests, or signs them with AWS SigV4"
license = "MIT"
repository = "https://github.com/nhz-io/credproxy"

[profile.release]
strip = true

[dependencies]
aws-credential-types = "1"
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http", "http1"] }
aws-smithy-runtime-api = "1"
bytes = "1.12.1"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
graphql-parser = "0.4.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
toml = "1.1.8"
zeroize = "1.9.1"

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3.27.0"
